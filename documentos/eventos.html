<!-- Eventos e Oportunidades (dados em _data/eventos.yml) -->
<div class="ri-card-full ri-card-full--eventos">
  <h3>Eventos e Oportunidades</h3>

  {% for e in site.data.eventos %}
  <div class="ri-evento">
    <div class="ri-evento-linha">
      <div class="ri-evento-texto">
        <p class="ri-evento-titulo">📢
          <a href="{{ e.link }}" target="_blank" rel="noopener">
            {{ e.titulo }}
          </a>
        </p>
        <p class="ri-evento-descricao">{{ e.descricao }}</p>
        <a class="ri-evento-botao" href="{{ e.botao_link }}" target="_blank" rel="noopener">
          {{ e.botao_texto }}
        </a>
      </div>
      {% if e.imagem %}
      <div class="ri-evento-miniatura">
        <a href="{{ e.botao_link }}" target="_blank" rel="noopener">
          <img src="{{ e.imagem }}" alt="{{ e.imagem_alt }}">
        </a>
      </div>
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>
