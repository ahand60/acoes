<!-- Parcerias (dados em _data/parcerias.yml) -->
<div class="ri-card-full">
  <h3>Parcerias Internacionais</h3>
  <p>O IFSP mantém acordos e parcerias com instituições de ensino e pesquisa no exterior.</p>
  <div class="ri-parcerias ri-parcerias--topo">
    {% for p in site.data.parcerias %}
    <span class="ri-parceria-item">{{ p.icone }} {{ p.nome }}</span>
    {% endfor %}
  </div>
  <p class="ri-parcerias-nota">
    <strong>Memorando de Entendimento</strong> com Pascual Bravo, viabilizado pelo Prof. Dr. Wilson Carlos da Silva Junior.
  </p>
</div>
